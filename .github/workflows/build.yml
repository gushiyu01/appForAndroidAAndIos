name: Build Android and iOS

on:
  push:
    branches:
      - codex/gravity-maze-game
  pull_request:
    branches:
      - codex/gravity-maze-game
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.9"

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Create Flutter platforms
        run: flutter create . --no-pub --platforms android,ios --project-name app_for_android_a_and_ios --org com.gushiyu01

      - name: Prepare native platform settings
        run: python tool/prepare_platforms.py

      - name: Validate platform templates
        run: python tool/validate_templates.py --generated

      - name: Test platform preparation
        run: python3 -m unittest discover -s tool/tests -v

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Test
        run: flutter test --no-pub

      - name: Build APK
        run: flutter build apk --release --no-pub

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload Android diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-diagnostics
          path: |
            android/app/build.gradle.kts
            android/gradle.properties
            android/app/src/main/AndroidManifest.xml
            android/app/src/main/kotlin/**/MainActivity.kt
            build/app/reports/
          if-no-files-found: ignore

  ios:
    name: iOS build
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Create Flutter platforms
        run: flutter create . --no-pub --platforms android,ios --project-name app_for_android_a_and_ios --org com.gushiyu01

      - name: Prepare native platform settings
        run: python3 tool/prepare_platforms.py

      - name: Validate platform templates
        run: python3 tool/validate_templates.py --generated

      - name: Test platform preparation
        run: python3 -m unittest discover -s tool/tests -v

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Test
        run: flutter test --no-pub

      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign --no-pub

      - name: Package iOS app
        run: ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app Runner-ios-unsigned.zip

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: runner-ios-unsigned
          path: Runner-ios-unsigned.zip
          if-no-files-found: error

      - name: Upload iOS diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-diagnostics
          path: |
            ios/Runner/AppDelegate.swift
            ios/Runner/Info.plist
          if-no-files-found: ignore
